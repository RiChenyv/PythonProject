[project]
name = "pythonproject"
version = "0.1.0"
description = "Python 学习实战项目（含可视化、SQL、PySpark 等）"
readme = "README.md"
authors = [
    { name = "RICHENYV", email = "1359466806@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyecharts>=2.1.0",
    "pymysql>=1.2.0",
    "pyspark>=4.2.0",
]

[project.scripts]
pythonproject = "pythonproject:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
